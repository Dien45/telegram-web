name: Build APK

on:
  push:
    tags: 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: android-34
          cmd-tools-version: 803839
          nda: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-gradle: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
        working-directory: telegram-web-client
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Align APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/telegram-web-client-aligned.apk
        working-directory: telegram-web-client

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias webclient \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --min-sdk-version 26 \
            app/build/outputs/apk/release/telegram-web-client-aligned.apk
        working-directory: telegram-web-client

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify \
            app/build/outputs/apk/release/telegram-web-client-aligned.apk
        working-directory: telegram-web-client

      - name: Rename final APK
        run: |
          mv app/build/outputs/apk/release/telegram-web-client-aligned.apk \
             app/build/outputs/apk/release/telegram-web-client.apk
        working-directory: telegram-web-client

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: telegram-web-client/app/build/outputs/apk/release/telegram-web-client.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}