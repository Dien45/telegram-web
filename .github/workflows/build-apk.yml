name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: android-34
          cmd-tools-version: 8038392

      - name: License Android SDK
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-gradle: true

      - name: Generate Keystore
        run: |
          keytool -genkey \
            -keystore keystore.jks \
            -alias webclient \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=TelegramWebClient, OU=Dev, O=Telegram, L=Jakarta, ST=DKI Jakarta, C=ID"

      - name: Build Release APK
        working-directory: telegram-web-client
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Align APK
        working-directory: telegram-web-client
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

      - name: Sign APK
        working-directory: telegram-web-client
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA256 \
            app-release-aligned.apk \
            ../keystore.jks \
            -storepass android \
            -keypass android \
            -tsa https://timestamp.digicert.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-apk
          path: telegram-web-client/app-release-aligned.apk